[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "connectome"
version = "0.1.0"
description = "Threshold-sensitivity analysis of neuron rankings in the MaleCNS v1.0 fruit fly connectome"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=23.0.1",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "requests>=2.33.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
